packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain hardening (pnpm 11)
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true

# Packages whose publish identity changed over time (pre-trustedPublisher era).
# Keep this list minimal; drop entries when a newer trusted release lands.
trustPolicyExclude:
  - chokidar@4.0.3
  - eslint-import-resolver-typescript@3.10.1
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1

# Lifecycle scripts: only packages that must build native binaries / fetch engines.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  bufferutil: true
  utf-8-validate: true
  turbo: true
  secp256k1: true
  msw: true
  vue-demi: true
  es5-ext: false

# Dependency version pins. pnpm no longer reads the `pnpm.overrides` field
# from package.json — overrides live here now. Most are security/transitive
# pins; keep in sync with the audit allowlist.
overrides:
  lodash: 4.18.1
  picomatch: 4.0.4
  yaml: 2.8.3
  effect: 3.21.0
  defu: 6.1.6
  bn.js: 4.12.3
  minimatch@<4: 3.1.4
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  brace-expansion@<2: 1.1.13
  brace-expansion@>=2.0.0 <2.0.3: 2.0.3
  ajv@<7: 6.14.0
  postcss: 8.5.15
  esbuild: 0.28.1
  vite: 6.4.3
  ws: 8.21.0
