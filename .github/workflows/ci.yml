name: CI

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turborepo Remote Cache (Vercel). Forks without these secrets fall back to
# the local cache automatically — every step below still works.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  verification:
    name: Verification
    runs-on: ubuntu-latest
    env:
      VERIFY_MODE: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'pre-main' || 'dev' }}
      VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Ubuntu runners supply native PostgreSQL binaries. The verification
      # runner starts its own private, socket-only temporary cluster: no shared
      # service, DATABASE_URL, production credentials or E2E secrets required.
      - run: pnpm "verify:${VERIFY_MODE}" --base "$VERIFY_BASE"
      - name: Validate deployment config (not a deployment)
        if: env.VERIFY_MODE == 'pre-main'
        run: pnpm deploy:check
      - name: Upload coverage report
        if: always() && env.VERIFY_MODE == 'pre-main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 30
